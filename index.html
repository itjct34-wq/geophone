    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "GeoPhone Intelligence",
          "applicationCategory": "UtilitiesApplication",
          "operatingSystem": "Web",
          "url": "https://geophone-alpha.vercel.app/",
          "description": "Free phone number, carrier and IP lookup with open-source research tools and consent-based location sharing.",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Is GeoPhone free to use?",
              "acceptedAnswer": { "@type": "Answer", "text": "Yes. Phone number lookup, IP and network lookup, and the open-source research tools are free and work without an account. Live location, the 3D globe, investigations and campaign tools are part of paid access." }
            },
            {
              "@type": "Question",
              "name": "Can I find someone's location from their phone number?",
              "acceptedAnswer": { "@type": "Answer", "text": "No. A phone number only reveals the country, carrier and line type, never a live position. To see where someone is, you send them a link; they open it, see who is asking, and choose to share. Nothing is collected without their consent." }
            },
            {
              "@type": "Question",
              "name": "Do I need to install anything?",
              "acceptedAnswer": { "@type": "Answer", "text": "No. GeoPhone runs in your browser on any phone or computer. Create a free account to save your lookup history and batch lists." }
            }
          ]
        }
      ]
    }
    </script>
